name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat <<EOF > .env
          SECRET_KEY=ci-test-secret-key
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          REDIS_HOST=redis
          EOF

      - name: Build images
        run: docker compose build

      # Only what the tests need (no flower, beat, redisinsight).
      # `up -d` waits for the db healthcheck because of depends_on.
      - name: Start services
        run: docker compose up -d db redis backend

      - name: Lint with flake8
        run: docker compose exec -T backend flake8 .

      - name: Run tests
        run: docker compose exec -T backend pytest --cov=users --cov=website

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v